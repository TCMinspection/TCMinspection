<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断结果</title>
    <style>
        body {
            font-family: 'SimSun', serif;
            background-color: #f4f0e5;
            padding: 20px;
        }

        h2 {
            color: #5d4037;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>诊断结果</h1>
    <div id="result-content"></div>
    <script>
        // 获取URL中的诊断结果参数
        const urlParams = new URLSearchParams(window.location.search);
        const prediction = urlParams.get('prediction');

        const resultContent = document.getElementById('result-content');

        if (prediction === 'white.png') {
            resultContent.innerHTML = `
                <h2>面色诊断结果</h2>
                <ul>
                    <li>面色苍白</li>
                <h2>可能疾病</h2>
                <ul>
                    <li>气血两虚：常见于贫血、营养不良、慢性疲劳综合征。</li>
                    <li>肺气虚：关联慢性呼吸道疾病（如哮喘）、免疫力低下。</li>
                    <li>肾阳虚：多与甲状腺功能减退、生殖功能衰退、慢性肾病相关。</li>
                    <li>寒凝血瘀：见于痛经、末梢循环障碍（如雷诺氏综合征）。</li>
                </ul>
                <h2>健康建议</h2>
                <h3>饮食调理</h3>
                <ul>
                    <li>补气血：红枣、桂圆、山药、瘦肉、动物肝脏（猪肝）。</li>
                    <li>温阳散寒：生姜、羊肉、核桃、肉桂，避免生冷（冰饮、西瓜、苦瓜）。</li>
                </ul>
                <h3>生活习惯</h3>
                <ul>
                    <li>注重保暖（尤其腹部、手脚），避免久坐或久吹空调。</li>
                    <li>规律作息，保证充足睡眠（晚11点前入睡）。</li>
                    <li>适度运动（太极拳、慢跑）以促进气血循环。</li>
                </ul>
                <h3>中医干预</h3>
                <ul>
                    <li>气血虚：服用四物汤、八珍汤；艾灸足三里、血海穴。</li>
                    <li>肾阳虚：金匮肾气丸；艾灸关元穴、命门穴。</li>
                    <li>肺气虚：玉屏风散提升免疫力。</li>
                </ul>
                <h3>警惕急症</h3>
                <ul>
                    <li>若伴随晕厥、胸痛、呼吸困难，需排除急性失血或心脏病，立即就医。</li>
                    <li>长期面色苍白建议检查血常规、甲状腺及肝肾功能。</li>
                </ul>
                <h3>其他注意</h3>
                <ul>
                    <li>避免过度思虑，保持情绪稳定（冥想、深呼吸）。</li>
                    <li>湿热体质者不宜盲目温补，需中医辨证后调理。</li>
                </ul>
            `;
        } else if (prediction === 'red.png') {
            resultContent.innerHTML = `
                <h2>面色诊断结果</h2>
                <ul>
                    <li>面色赤红</li>
                <h2>可能疾病</h2>
                <ul>
                    <li>阴虚火旺：常见于更年期综合征、甲状腺功能亢进症，身体阴阳失衡，虚火内生致面色潮红。</li>
                    <li>肝阳上亢：关联高血压病、脑血管疾病，多因肝肾阴虚，肝阳升发太过，气血上冲于面。</li>
                    <li>外感发热：如感冒、肺炎等感染性疾病初期，邪热侵袭人体，体温升高而面色发红。</li>
                </ul>
                <h2>健康建议</h2>
                <h3>饮食调理</h3>
                <ul>
                    <li>滋阴降火：百合、银耳、雪梨、绿豆、鸭肉。</li>
                    <li>平肝潜阳：芹菜、菊花、绿茶、菠菜，忌辛辣（辣椒、花椒）、温热性食物（羊肉、桂圆）。</li>
                </ul>
                <h3>生活习惯</h3>
                <ul>
                    <li>避免熬夜，保证充足睡眠，利于阴气恢复。</li>
                    <li>适度运动（瑜伽、八段锦），避免剧烈运动，防止阳气过亢。</li>
                    <li>注意情绪调节，避免情绪激动、焦虑，保持心情舒畅。</li>
                </ul>
                <h3>中医干预</h3>
                <ul>
                    <li>阴虚火旺：服用知柏地黄丸；艾灸涌泉穴、太溪穴。</li>
                    <li>肝阳上亢：天麻钩藤饮；按摩太冲穴、行间穴。</li>
                    <li>外感发热：银翘解毒片（风热）、感冒清热颗粒（风寒）。</li>
                </ul>
                <h3>警惕急症</h3>
                <ul>
                    <li>若面色红且伴有高热、抽搐、剧烈头痛，需排除脑膜炎、中暑等急症，立即就医。</li>
                    <li>长期面色潮红且伴有多汗、心悸，建议检查甲状腺功能。</li>
                </ul>
                <h3>其他注意</h3>
                <ul>
                    <li>避免长时间处于高温环境，注意防暑降温。</li>
                    <li>情绪波动大时可通过听音乐、散步等方式缓解。</li>
                </ul>
            `;
        } else if (prediction === 'yellow.png') {
            resultContent.innerHTML = `
                <h2>面色诊断结果</h2>
                <ul>
                    <li>面色萎黄</li>
                <h2>可能疾病</h2>
                <ul>
                    <li>脾胃虚弱：常见于慢性胃炎、消化性溃疡等消化系统疾病，脾胃运化功能失常，气血生化不足。</li>
                    <li>湿热内蕴：关联黄疸型肝炎、胆囊炎等肝胆疾病，湿热熏蒸肝胆，胆汁外溢而面色发黄。</li>
                    <li>气血不足：如缺铁性贫血、营养不良，血液亏虚不能荣养面部。</li>
                </ul>
                <h2>健康建议</h2>
                <h3>饮食调理</h3>
                <ul>
                    <li>健脾益胃：山药、薏米、芡实、白扁豆、红枣。</li>
                    <li>清热利湿：冬瓜、苦瓜、茵陈、玉米须，避免油腻（油炸食品）、甜食（蛋糕）。</li>
                </ul>
                <h3>生活习惯</h3>
                <ul>
                    <li>规律饮食，定时定量，避免暴饮暴食。</li>
                    <li>注意休息，避免过度劳累，保证充足睡眠。</li>
                    <li>适当运动（散步、慢跑），增强脾胃功能。</li>
                </ul>
                <h3>中医干预</h3>
                <ul>
                    <li>脾胃虚弱：服用参苓白术散；艾灸中脘穴、足三里穴。</li>
                    <li>湿热内蕴：茵陈蒿汤；按摩阳陵泉穴、阴陵泉穴。</li>
                    <li>气血不足：归脾汤；艾灸气海穴、血海穴。</li>
                </ul>
                <h3>警惕急症</h3>
                <ul>
                    <li>若面色黄且伴有恶心、呕吐、右上腹剧痛，需排除胆囊炎、胆结石等急症，立即就医。</li>
                    <li>长期面色发黄且伴有乏力、食欲不振，建议检查肝功能、血常规。</li>
                </ul>
                <h3>其他注意</h3>
                <ul>
                    <li>保持心情舒畅，避免思虑过度伤脾。</li>
                    <li>注意个人卫生，预防肝胆疾病。</li>
                </ul>
            `;
        } else if (prediction === 'black.png') {
            resultContent.innerHTML = `
                <h2>面色诊断结果</h2>
                <ul>
                    <li>面色黧黑</li>
                <h2>可能疾病</h2>
                <ul>
                    <li>肾虚：常见于慢性肾病、内分泌失调，肾主水，肾虚则水液代谢失常，黑色外现。</li>
                    <li>血瘀：关联心血管疾病、肿瘤等，气血运行不畅，瘀血阻滞，面色晦暗发黑。</li>
                    <li>寒湿内盛：如关节炎、冻疮，寒湿之邪侵袭人体，气血凝滞而面色发黑。</li>
                </ul>
                <h2>健康建议</h2>
                <h3>饮食调理</h3>
                <ul>
                    <li>补肾益精：黑芝麻、黑豆、核桃、枸杞、羊肉。</li>
                    <li>活血化瘀：山楂、玫瑰花、红糖，避免生冷（冷饮、生鱼片）。</li>
                </ul>
                <h3>生活习惯</h3>
                <ul>
                    <li>注意保暖，尤其是腰腹、下肢，避免受寒。</li>
                    <li>规律作息，避免熬夜，保证充足睡眠以养肾。</li>
                    <li>适度运动（太极拳、慢跑），促进气血循环。</li>
                </ul>
                <h3>中医干预</h3>
                <ul>
                    <li>肾虚：服用六味地黄丸（肾阴虚）、右归丸（肾阳虚）；艾灸肾俞穴、关元穴。</li>
                    <li>血瘀：血府逐瘀汤；按摩血海穴、三阴交穴。</li>
                    <li>寒湿内盛：独活寄生汤；艾灸命门穴、腰阳关穴。</li>
                </ul>
                <h3>警惕急症</h3>
                <ul>
                    <li>若面色黑且伴有水肿、少尿、呼吸困难，需排除肾衰竭、心力衰竭等急症，立即就医。</li>
                    <li>长期面色发黑且伴有腰痛、乏力，建议检查肾功能、泌尿系统超声。</li>
                </ul>
                <h3>其他注意</h3>
                <ul>
                    <li>避免长时间日晒，做好防晒措施。</li>
                    <li>保持心情舒畅，避免情绪低落加重血瘀。</li>
                </ul>
            `;
        } else if (prediction === 'cyan.png') {
            resultContent.innerHTML = `
                <h2>面色诊断结果</h2>
                <ul>
                    <li>面色夭青</li>
                <h2>可能疾病</h2>
                <ul>
                    <li>肝郁气滞：常见于焦虑症、抑郁症等精神系统疾病，以及乳腺增生、月经不调等妇科疾病。肝脏的疏泄功能失常，气机郁结，气血运行不畅，导致面色发青。</li>
                    <li>寒凝血脉：关联雷诺氏病、冻疮等末梢循环障碍疾病，以及痛经、宫寒等妇科问题。寒邪侵袭人体，使血脉收缩，气血凝滞，从而面色呈现青色。</li>
                    <li>瘀血内阻：常见于冠心病、脑血管疾病等心血管系统疾病，以及外伤后遗症。体内瘀血停留，气血运行受阻，面部气血供应异常而面色发青。</li>
                </ul>
                <h2>健康建议</h2>
                <h3>饮食调理</h3>
                <ul>
                    <li>疏肝理气：佛手、香橼、玫瑰花、陈皮、山楂。</li>
                    <li>温通血脉：肉桂、干姜、胡椒、当归、川芎，避免食用生冷食物（冰淇淋、生黄瓜）和油腻食物（油炸薯条）。</li>
                </ul>
                <h3>生活习惯</h3>
                <ul>
                    <li>注意保暖，特别是四肢和腹部，避免寒邪入侵。</li>
                    <li>保持规律的作息，早睡早起，保证充足的睡眠，以利于肝脏的修复和气血的调养。</li>
                    <li>进行适当的运动，如散步、瑜伽、太极剑等，有助于促进气血流通，缓解肝郁和寒凝。</li>
                </ul>
                <h3>中医干预</h3>
                <ul>
                    <li>肝郁气滞：服用逍遥丸、柴胡疏肝散；按摩太冲穴、期门穴。</li>
                    <li>寒凝血脉：服用少腹逐瘀汤；艾灸神阙穴、关元穴。</li>
                    <li>瘀血内阻：服用血府逐瘀胶囊；按摩血海穴、膈俞穴。</li>
                </ul>
                <h3>警惕急症</h3>
                <ul>
                    <li>若面色青且伴有剧烈胸痛、心悸、呼吸困难等症状，需排除急性心肌梗死、肺栓塞等严重心血管疾病，应立即就医。</li>
                    <li>长期面色青且伴有头痛、眩晕等症状，建议进行心电图、心脏超声、脑部CT等检查，以排查潜在的疾病。</li>
                </ul>
                <h3>其他注意</h3>
                <ul>
                    <li>保持心情舒畅，避免情绪过度波动，可通过听音乐、旅游等方式缓解压力。</li>
                    <li>注意外伤后的护理，避免瘀血残留，如有旧伤不适及时进行调理。</li>
                </ul>
            `;
        }else{
            resultContent.innerHTML = '<p>未识别的诊断结果，请重新检查。</p>';
        }
    </script>
</body>

</html>
