[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcminspection"
version = "0.1.0"
description = "TCM AI complexion analysis web app."
readme = "README_WebApp.md"
requires-python = ">=3.8"
dependencies = [
  "flask==2.3.3",
  "flask-cors==4.0.0",
  "opencv-python==4.8.1.78",
  "dlib==19.24.2",
  "numpy==1.24.3",
  "Pillow==10.0.1",
  "scikit-learn==1.3.0",
  "mindspore==2.2.10",
  "mindcv==0.4.0",
  "langchain==0.0.340",
  "langchain-openai==0.0.2",
  "langchain-community==0.0.6",
  "openai==0.28.1",
  "faiss-cpu==1.7.4",
  "joblib==1.3.2",
  "scikit-image==0.21.0",
  "requests==2.31.0",
]

[project.optional-dependencies]
torch = [
  "torch==2.0.1",
  "torchvision==0.15.2",
]
